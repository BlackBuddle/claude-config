<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-clash 선택기</title>
<style>
  /* 선택기는 시안이 아니다. 시안과 섞이지 않게 무채색으로 둔다 */
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; color: inherit; background: #222; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #eee; color: #111; border-color: #eee; }
  button:focus-visible { outline: 2px solid #6cf; outline-offset: 2px; }
  small { opacity: .7; margin-left: auto; }
  iframe { flex: 1; border: 0; background: #fff; }
</style>
</head>
<body>
<nav id="tabs" aria-label="시안 선택"></nav>
<iframe id="view" title="시안 미리보기"></iframe>
<script>
  // 총괄이 이 배열만 고친다. dir = 시안 폴더 이름
  const VARIANTS = [
    { dir: 'a', name: '시안 A', skill: '' },
    { dir: 'b', name: '시안 B', skill: '' },
    { dir: 'c', name: '시안 C', skill: '' },
  ];
  const tabs = document.getElementById('tabs');
  const view = document.getElementById('view');
  function show(i) {
    view.src = VARIANTS[i].dir + '/index.html';
    [...tabs.querySelectorAll('button')].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  }
  VARIANTS.forEach((v, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + v.name + (v.skill ? ' — ' + v.skill : '');
    b.onclick = () => show(i);
    tabs.append(b);
  });
  const hint = document.createElement('small');
  hint.textContent = '숫자 키 1~' + VARIANTS.length + '로 바꾼다';
  tabs.append(hint);
  // 시안 iframe 안에 포커스가 있으면 이 키 입력은 오지 않는다. 그때는 버튼을 누른다
  addEventListener('keydown', e => { const i = +e.key - 1; if (VARIANTS[i]) show(i); });
  show(0);
</script>
</body>
</html>
